spring:
  datasource:
    url:
    driverClassName: org.postgresql.Driver
    username:
    password:
    hikari:
      connection-test-query: SELECT 1
      maximumPoolSize: ${HIKARI_MAXIMUM_POOLSIZE:10}
      minimumIdle: ${HIKARI_MINIMUM_IDLE:1}
      idleTimeout: ${HIKARI_IDLE_TIMEOUT:600000}
      connectionTimeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      maxLifetime: ${HIKARI_MAX_LIFETIME:1800000}
      keepaliveTime: ${HIKARI_KEEPALIVE_TIME:180000}

  jpa:
    hibernate:
      ddl-auto: update
    generate-ddl: true
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        default_batch_fetch_size: 50
        batch_fetch_style: dynamic
        jdbc.batch_size: 30
        order_inserts: true
        order_updates: true

server:
  port: 8080


logging:
  level:
    root: INFO